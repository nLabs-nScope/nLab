<!DOCTYPE html>
<html lang="en">

<head>

<body>

    <main role="main" class="container-fluid h-100 d-flex flex-column">
        <div class="row bg-dark text-white py-2 align-items-center text-nowrap  ">
            <div class="sidebar"></div>
            <div class="col flex-grow-1 d-flex justify-content-between px-1">
                <div class="d-flex align-items-center gap-1">
                    <div class="btn-group px-1" role="group">
                        <button id="save-traces" class="btn btn-xs btn-outline-secondary">Save Traces</button>
                    </div>
                    <div class="btn-group btn-group-xs px-1">
                        <button type="button" id="extra-graphs-button" class="btn dropdown-toggle btn-outline-secondary"
                            data-bs-toggle="dropdown">Graphs:
                        </button>
                        <div class="dropdown-menu clickable" id="extra-graphs">
                            <div class="accordion accordion-flush">
                                <div class="accordion-item border-0">
                                    <h2 class="accordion-header px-2 py-1">
                                        <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" data-bs-target="#collapseOne"
                                            aria-expanded="false" aria-controls="collapseOne" id="xy-graph-view-on">
                                            X/Y View
                                        </button>
                                        <div class="btn-group" id="xy-graph-view" role="group">
                                            <input class="btn-check" type="radio" name="xy-graph-view"
                                                id="xy-graph-view-vertical" checked>
                                            <label
                                                class="btn btn-outline-secondary btn-xs shadow-none d-inline-flex align-items-center justify-content-center"
                                                for="xy-graph-view-vertical">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                                    stroke="currentColor" stroke-width="1" stroke-linecap="round"
                                                    stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                                                    <!-- Outer container with rounded corners -->
                                                    <rect x="2" y="2" width="12" height="12" rx="2" />
                                                    <!-- Vertical divider -->
                                                    <line x1="8" y1="2" x2="8" y2="14" />
                                                </svg>
                                            </label>
                                            <input class="btn-check" type="radio" name="xy-graph-view"
                                                id="xy-graph-view-horizontal">
                                            <label
                                                class="btn btn-outline-secondary btn-xs shadow-none d-inline-flex align-items-center justify-content-center"
                                                for="xy-graph-view-horizontal">

                                                    stroke="currentColor" stroke-width="1" stroke-linecap="round"
                                                    stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                                                    <!-- Outer container with rounded corners -->
                                                    <rect x="2" y="2" width="12" height="12" rx="2" />
                                                    <!-- Horizontal divider -->
                                                    <line x1="2" y1="8" x2="14" y2="8" />
                                                </svg>
                                            </label>
                                            <input class="btn-check" type="radio" name="xy-graph-view"
                                                id="xy-graph-view-full">
                                            <label
                                                class="btn btn-outline-secondary btn-xs shadow-none d-inline-flex align-items-center justify-content-center"
                                                for="xy-graph-view-full">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                                    xmlns="http://www.w3.org/2000/svg">
                                                    <!-- Outer window frame -->
                                                    <rect x="2" y="2" width="12" height="12" rx="2"
                                                        stroke="currentColor" stroke-width="1" stroke-linecap="round"
                                                        stroke-linejoin="round" />

                                                    <!-- Arrows group with thinner strokes -->
                                                    <g stroke="currentColor" stroke-width="0.75" fill="none"
                                                        stroke-linecap="round" stroke-linejoin="round">
                                                        <path d="M7.33 7.33 L4.67 4.67 M4.67 6.67 V4.67 H6.67" />

                                                        <!-- Top-right arrow -->
                                                        <path d="M8.67 7.33 L11.33 4.67 M9.33 4.67 H11.33 V6.67" />

                                                        <!-- Bottom-left arrow -->
                                                        <path d="M7.33 8.67 L4.67 11.33 M4.67 9.33 V11.33 H6.67" />

                                                        <path d="M8.67 8.67 L11.33 11.33 M9.33 11.33 H11.33 V9.33" />

                                                    <div class="d-grid"
                                                        style="grid-template-columns: min-content min-content; gap: 0;">

                                                                    name="xy-graph-y-source" id="y-source-Ch4">

                                                                    name="xy-graph-y-source" id="y-source-Ch3">

                                                                <label

                                                            </div>
                                                        </div>

                                                        <div
                                                            style="margin-top: 5px; margin-right: 5px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.1) 1px, transparent 1px), linear-gradient(to top, rgba(255, 255, 255, 0.1) 1px, transparent 1px); background-size: 10px 10px; background-position: left bottom;">
                                                        </div>

                                                        <div></div>

                                                                <input class="btn-check" type="radio"

                                                                <input class="btn-check" type="radio"

                                                                <label
                                                                    class="btn btn-outline-secondary btn-xs shadow-none"

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                                    </g>
                                                </svg>
                                            </label>
                                        </div>

                                                        <input class="btn-check" type="radio"
                                                            name="fft-graph-scale" id="fft-scale-log" checked>
                                                        <label class="btn btn-outline-secondary btn-xs shadow-none"

                                                        <label class="btn btn-outline-secondary btn-xs shadow-none"
                                                            for="fft-scale-linear">Linear</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                        <input class="btn-check" type="radio" name="run-control" id="single">
                        <label class="btn btn-outline-secondary btn-xs shadow-none" for="single">Single</label>

                        <input class="btn-check" type="radio" name="run-control" id="stop">

                    </div>
                </div>
